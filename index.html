<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="#" aria-label="排班日历首页"><span class="brand-icon" aria-hidden="true">▦</span> 班表<span class="brand-divider"></span><span class="brand-sub">团队休息日历</span></a><span class="season">2026 · 10—12月</span></div></header>
  <main>
    <section class="intro"><div><div class="eyebrow">团队排班 / TEAM SCHEDULE</div><h1>把休息安排看清楚。</h1><p>丽萍与兴雅 · 10月5日至12月31日</p></div><div class="coverage"><span class="coverage-check" aria-hidden="true">✓</span><div><strong>周末在岗已覆盖</strong><span id="coverage-count"></span></div></div></section>
    <div class="workspace">
      <section class="calendar-panel" aria-label="排班日历">
        <div class="calendar-toolbar"><div class="month-title"><h2 id="month-title"></h2><span id="month-caption"></span></div><div class="month-controls"><button id="prev" class="icon-button" aria-label="上一个月">‹</button><button id="next" class="icon-button" aria-label="下一个月">›</button></div></div>
        <div class="calendar-subbar"><div class="filters" role="group" aria-label="查看员工"><button data-filter="all" aria-pressed="true" class="active">全部</button><button data-filter="lp" aria-pressed="false"><span class="swatch lp"></span>丽萍</button><button data-filter="xy" aria-pressed="false"><span class="swatch xy"></span>兴雅</button></div><span class="calendar-hint">点击日期查看在岗安排</span></div>
        <div class="weekdays" aria-hidden="true"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div>
        <div id="calendar" class="calendar-grid"></div>
        <div class="calendar-footer"><span><i class="legend-line lp"></i>丽萍休息</span><span><i class="legend-line xy"></i>兴雅休息</span><span><i class="concert-dot"></i>演唱会</span><span class="footer-note">无休息标记的已排期日期正常上班</span></div>
      </section>
      <aside class="sidebar">
        <section class="day-panel" aria-labelledby="detail-title"><div class="section-label">当日安排</div><div class="detail-heading"><h2 id="detail-title"></h2><span id="detail-weekday"></span></div><div id="day-details" aria-live="polite"></div></section>
        <section class="summary-panel"><div class="section-label">本月休息</div><div id="person-summary"></div></section>
        <section class="special-panel"><div class="section-label">特别安排</div><button class="event" data-date="2026-10-17"><span class="event-date">10<span>/17</span></span><span><strong>兴雅演唱会</strong><small>17—18日连休 · 丽萍在岗</small></span><span class="event-mark" aria-hidden="true">♪</span></button><button class="event" data-date="2026-11-29"><span class="event-date">11<span>/29</span></span><span><strong>兴雅演唱会</strong><small>28—29日连休 · 丽萍在岗</small></span><span class="event-mark" aria-hidden="true">♪</span></button></section>
      </aside>
    </div>
    <section class="rest-overview"><div class="overview-heading"><div><div class="section-label">连休与单休</div><h2 id="overview-title">本月休息明细</h2></div><span>两人的双休均连续</span></div><p class="cadence-note">兴雅按休息轮次单休、双休交替；常规双休为周日＋周一，演唱会期间为周六＋周日。</p><div id="rest-lists" class="rest-lists"></div></section>
    <footer class="page-footer"><span>排班范围：2026.10.05 — 2026.12.31</span><span>10月1—4日未排期 · 11月30日、12月31日两人正常上班</span></footer>
  </main>
<script>'use strict';
const STAFF = [{id:'lp',name:'丽萍'},{id:'xy',name:'兴雅'}];
const REST = {
  lp:['2026-10-09','2026-10-10','2026-10-16','2026-10-23','2026-10-24','2026-10-31','2026-11-06','2026-11-07','2026-11-14','2026-11-20','2026-11-21','2026-11-27','2026-12-04','2026-12-05','2026-12-12','2026-12-18','2026-12-19','2026-12-26'],
  xy:['2026-10-11','2026-10-17','2026-10-18','2026-10-25','2026-11-01','2026-11-02','2026-11-08','2026-11-15','2026-11-16','2026-11-22','2026-11-28','2026-11-29','2026-12-06','2026-12-13','2026-12-14','2026-12-20','2026-12-27','2026-12-28']
};
const EVENTS = {'2026-10-17':'兴雅演唱会 · 17—18日连休','2026-11-29':'兴雅演唱会 · 28—29日连休'};
const GROUPS = {
  lp:[['2026-10-09','2026-10-10'],['2026-10-16'],['2026-10-23','2026-10-24'],['2026-10-31'],['2026-11-06','2026-11-07'],['2026-11-14'],['2026-11-20','2026-11-21'],['2026-11-27'],['2026-12-04','2026-12-05'],['2026-12-12'],['2026-12-18','2026-12-19'],['2026-12-26']],
  xy:[['2026-10-11'],['2026-10-17','2026-10-18'],['2026-10-25'],['2026-11-01','2026-11-02'],['2026-11-08'],['2026-11-15','2026-11-16'],['2026-11-22'],['2026-11-28','2026-11-29'],['2026-12-06'],['2026-12-13','2026-12-14'],['2026-12-20'],['2026-12-27','2026-12-28']]
};
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const START='2026-10-05', END='2026-12-31';
let month=10, filter='all', selected='2026-10-17';
const $=id=>document.getElementById(id);
function dateOf(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d,12);}
function keyOf(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function planned(key){return key>=START&&key<=END;}
function isRest(id,key){return REST[id].includes(key);}
function displayDate(key){const d=dateOf(key);return `${d.getMonth()+1}月${d.getDate()}日`;}
function dateLabel(key){return `${displayDate(key)}（${WEEKDAYS[dateOf(key).getDay()]}）`;}
function activeMonth(key){return Number(key.slice(5,7))===month;}
function personRows(key){return STAFF.map(s=>`<div class="person-row"><span class="person-name"><span class="avatar ${s.id}">${s.name[0]}</span>${s.name}</span><span class="status ${planned(key)&&isRest(s.id,key)?'rest '+s.id:''}">${!planned(key)?'未排期':isRest(s.id,key)?'休息':'在岗'}</span></div>`).join('');}
function renderDetails(){
  $('detail-title').textContent=displayDate(selected);
  $('detail-weekday').textContent=WEEKDAYS[dateOf(selected).getDay()];
  let note='';
  if(!planned(selected)) note='<div class="detail-note neutral">10月1—4日尚未安排。</div>';
  else if(EVENTS[selected]) note=`<div class="detail-note">♪ ${EVENTS[selected]}</div>`;
  else if(selected==='2026-10-18'||selected==='2026-11-28') note='<div class="detail-note">兴雅连休期间，丽萍在岗。</div>';
  else if(selected==='2026-10-16'||selected==='2026-11-27') note='<div class="detail-note neutral">丽萍单休调整到周五，次日周六在岗。</div>';
  else if(selected==='2026-11-30'||selected===END) note='<div class="detail-note neutral">两人正常上班。</div>';
  $('day-details').innerHTML=personRows(selected)+note;
}
function renderCalendar(){
  $('month-title').textContent=`2026年${month}月`;
  $('month-caption').textContent={10:'OCTOBER',11:'NOVEMBER',12:'DECEMBER'}[month];
  $('prev').disabled=month===10; $('next').disabled=month===12;
  const offset=(new Date(2026,month-1,1,12).getDay()+6)%7;
  const length=new Date(2026,month,0,12).getDate();
  let html='';
  for(let i=0;i<offset;i++) html+='<div class="day empty" aria-hidden="true"></div>';
  for(let d=1;d<=length;d++){
    const key=keyOf(2026,month,d), weekday=dateOf(key).getDay();
    const resting=STAFF.filter(s=>isRest(s.id,key));
    const label=planned(key)?STAFF.map(s=>`${s.name}${isRest(s.id,key)?'休息':'在岗'}`).join('，'):'未排期';
    const badges=resting.map(s=>`<span class="badge ${s.id}${filter!=='all'&&filter!==s.id?' dimmed':''}">${s.name}<span class="badge-suffix">休</span></span>`).join('');
    html+=`<button class="day${weekday===0||weekday===6?' weekend':''}${selected===key?' selected':''}${!planned(key)?' unplanned':''}" data-date="${key}" aria-pressed="${selected===key}" aria-label="${dateLabel(key)}，${label}${EVENTS[key]?'，兴雅演唱会':''}"><span class="day-top"><span class="day-number">${d}</span>${EVENTS[key]?'<span class="concert-icon" aria-hidden="true">♪</span>':''}</span>${badges}${!planned(key)?'<span class="unplanned-label">未排期</span>':''}</button>`;
  }
  for(let i=(offset+length)%7;i>0&&i<7;i++) html+='<div class="day empty" aria-hidden="true"></div>';
  $('calendar').innerHTML=html;
}
function renderSummary(){
  $('person-summary').innerHTML=STAFF.map(s=>{
    const days=REST[s.id].filter(activeMonth), doubles=GROUPS[s.id].filter(g=>g.length===2&&g.some(activeMonth)).length;
    return `<div class="summary-person"><div class="summary-label"><strong><span class="swatch ${s.id}"></span> ${s.name}</strong><small>${doubles}次连休 · ${days.length-doubles*2}次单休</small></div><div class="count" style="color:var(--${s.id==='lp'?'blue':'teal'})">${days.length}<span>天</span></div></div>`;
  }).join('')+`<div class="summary-foot">${month===10?'仅统计10月5日起的已排期日期':month===11?'包含11月30日的在岗安排':'已排班至12月31日'}</div>`;
}
function renderLists(){
  $('overview-title').textContent=`${month}月休息明细`;
  $('rest-lists').innerHTML=STAFF.filter(s=>filter==='all'||filter===s.id).map(s=>`<div class="rest-list"><div class="list-header"><span class="avatar ${s.id}">${s.name[0]}</span>${s.name}</div>${GROUPS[s.id].filter(g=>g.some(activeMonth)).map(g=>`<div class="rest-item"><span class="rest-type">${g.length===2?'连休':'单休'}</span><strong>${g.map(dateLabel).join('、')}</strong></div>`).join('')}</div>`).join('');
  $('rest-lists').style.gridTemplateColumns=filter==='all'?'':'1fr';
}
function render(){renderCalendar();renderDetails();renderSummary();renderLists();}
function selectDate(key){selected=key;month=Number(key.slice(5,7));render();}
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{
  filter=button.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button));});
  renderCalendar();renderLists();
}));
$('calendar').addEventListener('click',event=>{const button=event.target.closest('[data-date]');if(button){selectDate(button.dataset.date);document.querySelector(`#calendar [data-date="${selected}"]`).focus({preventScroll:true});}});
document.querySelectorAll('.event').forEach(button=>button.addEventListener('click',()=>selectDate(button.dataset.date)));
$('prev').addEventListener('click',()=>{if(month>10){month--;selected=keyOf(2026,month,5);render();}});
$('next').addEventListener('click',()=>{if(month<12){month++;selected=keyOf(2026,month,1);render();}});
let covered=0,total=0;
for(let d=dateOf(START);d<=dateOf(END);d.setDate(d.getDate()+1)) if(d.getDay()===0||d.getDay()===6){total++;const key=keyOf(d.getFullYear(),d.getMonth()+1,d.getDate());if(STAFF.some(s=>!isRest(s.id,key))) covered++;}
$('coverage-count').textContent=`${covered} / ${total} 个周末日期至少1人在岗`;
render();
</script>
</body>
</html>
